name: CI

on:
  push:
    branches: [frame-0.1, "*.x", "**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      # 离线模式:禁止 CI 下载 embedding 模型(fail-fast,避免 1.2GB 下载挂起)
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        # 报告但不阻断(待全库 ruff 清理后去掉 continue-on-error)。Report but non-blocking.
        continue-on-error: true
        run: ruff check core/ splitters/ vector_stores/ retrievers/ routers/ adapters/ manufacturing/ config/ app_factory.py config/loader.py
      - name: Tests
        # 模型依赖用例由 conftest embeddings fixture / rag fixture 在缺模型时自动 SKIP(非报错)
        run: pytest tests/ -v -m "not needs_model"
      - name: Version
        run: python -c "import app_factory; print(app_factory.__version__)"