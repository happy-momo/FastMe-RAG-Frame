# FastMe RAG Chatbot Demo — Docker Compose 一键栈
# 依赖：用户自带 OpenAI 兼容 LLM 端点（见 backend/.env.example 与 CHATBOT_DEMO.md）
#
# 启动 / Start:
#   cp backend/.env.example .env   # 可选：配置 LLM 端点
#   docker compose up --build
# 访问 / Access: http://localhost:8080
#
# A2 embedding 策略：
#   - 设置 EMBEDDING_MODEL 为本地路径（挂载卷内）→ 直接使用
#   - 不设置 / 设为 HF 模型名 → 首次启动自动从 HuggingFace 下载到卷
#     (国内可设 HF_ENDPOINT=https://hf-mirror.com)

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fastme-rag-backend
    ports:
      - "8000:8000"
    environment:
      # ===== LLM（用户自带 OpenAI 兼容端点）=====
      # 本地无鉴权服务（Ollama/vLLM）可用占位 key：openai 客户端要求非空 api_key
      FASTME_LLM_BASE_URL: ${FASTME_LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      FASTME_LLM_API_KEY: ${FASTME_LLM_API_KEY:-not-needed}
      FASTME_LLM_MODEL: ${FASTME_LLM_MODEL:-qwen-plus}
      # ===== Embedding（A2：有本地则用，无则自动下载）=====
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      MODEL_CACHE_DIR: /app/models
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      # ===== 向量库 =====
      FASTME_VECTOR_STORE_TYPE: ${FASTME_VECTOR_STORE_TYPE:-chroma}
      FASTME_CHROMA_PERSIST_DIR: /app/data/chroma
      FASTME_CHROMA_COLLECTION: ${FASTME_CHROMA_COLLECTION:-fastme_rag}
      # ===== 其他 =====
      FASTME_LANGUAGE: ${FASTME_LANGUAGE:-zh}
    volumes:
      - rag-models:/app/models     # embedding 模型缓存
      - rag-data:/app/data         # 向量库持久化
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: fastme-rag-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rag-models:
  rag-data: