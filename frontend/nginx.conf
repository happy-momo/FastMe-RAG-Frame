server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源 / static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 使用 Docker 内嵌 DNS 延时解析 upstream，
    # 避免启动时解析失败导致 nginx emerg 崩溃（backend 重启窗口也不受影响）
    # Resolve upstream lazily via Docker's embedded DNS so nginx never crashes
    # on startup even if the backend is temporarily unavailable.
    resolver 127.0.0.11 valid=10s;

    # API 反代到后端 / proxy API to backend service
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE：关闭缓冲，保证实时 / SSE: disable buffering for real-time
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location = /healthz {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
    }
}